name: Keep Supabase awake

on:
  schedule:
    # Twice a week, comfortably under Supabase's 7-day pause window.
    # Two fixed weekdays instead of "every 5 days" — easier to reason about,
    # and if one run gets delayed by GitHub's scheduler under load, the other
    # still lands well inside the 7-day limit.
    - cron: '0 3 * * 1'   # Monday 03:00 UTC
    - cron: '0 3 * * 4'   # Thursday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write   # required for the keepalive-commit step below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            "https://myezfpifwwlzggqfsgts.supabase.co/rest/v1/letters?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/response.json || true

          # Original script never checked this — curl exits 0 even on 401/403/500,
          # so a failing ping was invisible in the Actions UI. Fail loudly instead.
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Supabase ping failed with HTTP $HTTP_CODE — check the key, RLS policy, or project status."
            exit 1
          fi

      - name: Record a repo commit so GitHub doesn't auto-disable this schedule
        run: |
          # GitHub silently disables scheduled workflows after 60 days with no
          # push/release/PR-merge activity in the repo. A static GitHub Pages site
          # can easily go that long with zero commits. This step pushes a tiny,
          # harmless commit on every successful run so the 60-day clock never
          # expires — no manual re-enabling, no silent failure.
          mkdir -p .keepalive
          date -u +"Last successful ping: %Y-%m-%dT%H:%M:%SZ" > .keepalive/last-ping.txt

          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive/last-ping.txt

          if ! git diff --cached --quiet; then
            git commit -m "chore: keepalive ping $(date -u +%Y-%m-%d)"
            git push
          fi
